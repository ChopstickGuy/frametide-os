name: ISO bauen

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Paketverfügbarkeit prüfen
        run: python3 tools/check-packages.py
      - name: Hardware-Erkennung testen
        run: python3 packages/vektor-hwsetup/usr/sbin/vektor-hwsetup

  iso:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Speicherplatz freigeben
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          df -h /
      - name: Build-Werkzeuge
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools xorriso dosfstools mtools curl librsvg2-bin
      - name: ISO bauen
        run: sudo ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: vektor-os-iso
          path: |
            out/*.iso
            out/*.sha256
          compression-level: 0
      - name: Release (bei Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.iso
            out/*.sha256
