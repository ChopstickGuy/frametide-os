name: Build ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**", ".github/ISSUE_TEMPLATE/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", ".github/ISSUE_TEMPLATE/**"]

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check package availability
        run: python3 tools/check-packages.py
      - name: Check translations
        run: python3 tools/i18n.py check
      - name: Check Python code
        run: |
          python3 -m py_compile packages/frametide-tools/usr/lib/frametide/*.py \
            tools/*.py artwork/*.py
          python3 -c "import ast,sys; [ast.parse(open(f).read()) for f in sys.argv[1:]]" \
            packages/frametide-hwsetup/usr/sbin/frametide-hwsetup \
            packages/frametide-tools/usr/lib/frametide/frametide-helper
      - name: Check shell scripts
        run: |
          for f in build.sh scripts/chroot-install.sh packages/build-debs.sh; do bash -n "$f"; done
          for f in packages/*/DEBIAN/{preinst,postinst,postrm} packages/*/usr/lib/frametide/install-*; do
            [ -f "$f" ] && sh -n "$f"
          done
      - name: Test hardware detection
        run: python3 packages/frametide-hwsetup/usr/sbin/frametide-hwsetup
      - name: Build packages
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          ./packages/build-debs.sh

  iso:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      SF_USER: ${{ secrets.SF_USER }}
      SF_PROJECT: ${{ secrets.SF_PROJECT }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
            /usr/local/share/boost /usr/local/.ghcup /usr/share/swift
          sudo docker image prune --all --force || true
          df -h / /mnt
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools xorriso dosfstools mtools curl librsvg2-bin
      - name: Build ISO image
        run: sudo ./build.sh
      - name: ISO size
        run: ls -lh out/*.iso && cat out/*.sha256
      - name: Install test (unpack exactly like the Calamares installer)
        continue-on-error: true
        run: |
          mkdir -p screenshots
          sudo mkdir -p /mnt/iso /mnt/sq /mnt/target
          sudo mount -o loop,ro out/*.iso /mnt/iso
          sudo mount -t squashfs -o loop,ro /mnt/iso/casper/filesystem.squashfs /mnt/sq
          truncate -s 40G /tmp/target.img && mkfs.ext4 -q -F /tmp/target.img
          sudo mount -o loop /tmp/target.img /mnt/target
          # dieselben Optionen wie Calamares unpackfs (3.3)
          set +e
          sudo rsync -aHAXSr --filter='-x trusted.overlay.*' --exclude /proc/ --exclude /sys/ \
            --exclude /dev/ --exclude /run/ --exclude /run/udev/ --exclude /sys/firmware/efi/efivars/ \
            /mnt/sq/ /mnt/target/ 2> screenshots/install-test-rsync-errors.txt
          rc=$?
          set -e
          echo "rsync exit code: $rc" | tee screenshots/install-test-result.txt
          tail -40 screenshots/install-test-rsync-errors.txt | tee -a screenshots/install-test-result.txt
          df -h /mnt/target | tee -a screenshots/install-test-result.txt
          ls /mnt/sq/usr/share/calamares/modules /mnt/sq/etc/calamares/modules 2>&1 | tee -a screenshots/install-test-result.txt
          sudo umount /mnt/target /mnt/sq /mnt/iso
          [ "$rc" = 0 ]
      - name: Boot test in QEMU (UEFI and BIOS, with screenshots)
        continue-on-error: true
        run: |
          sudo apt-get install -y qemu-system-x86 ovmf socat imagemagick
          [ -e /dev/kvm ] && sudo chmod 666 /dev/kvm && echo "KVM verfügbar"
          mkdir -p screenshots
          iso=$(ls out/*.iso)
          shot() {  # $1 = Modus, $2 = Name
            echo "screendump /tmp/$2.ppm" | socat - "unix-connect:/tmp/mon-$1" >/dev/null
            sleep 2 && convert "/tmp/$2.ppm" "screenshots/$2.png" && echo "Screenshot: $2"
          }
          for mode in uefi bios; do
            qemu-img create -f qcow2 "/tmp/disk-$mode.qcow2" 40G >/dev/null   # leere Platte für den Installer
            args=(-m 6144 -smp 4 -cdrom "$iso" -boot d -vga virtio -display none
                  -drive "file=/tmp/disk-$mode.qcow2,if=virtio,format=qcow2"
                  -monitor "unix:/tmp/mon-$mode,server,nowait")
            [ -e /dev/kvm ] && args+=(-enable-kvm -cpu host)
            [ "$mode" = uefi ] && args+=(-bios /usr/share/ovmf/OVMF.fd)
            qemu-system-x86_64 "${args[@]}" &
            pid=$!
            sleep 8;   shot "$mode" "$mode-1-bootmenue"
            sleep 40;  shot "$mode" "$mode-2-start"
            sleep 150; shot "$mode" "$mode-3-desktop"
            # App-Übersicht: Installer-Fenster schließen (Esc), dann zweimal Super
            echo "sendkey esc" | socat - "unix-connect:/tmp/mon-$mode" >/dev/null; sleep 3
            echo "sendkey meta_l" | socat - "unix-connect:/tmp/mon-$mode" >/dev/null; sleep 2
            echo "sendkey meta_l" | socat - "unix-connect:/tmp/mon-$mode" >/dev/null; sleep 4
            shot "$mode" "$mode-4-apps"
            kill "$pid" || true
            wait "$pid" 2>/dev/null || true
          done
          ls -la screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: boot-screenshots
          path: screenshots/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: frametide-os-iso
          path: |
            out/*.iso
            out/*.sha256
          compression-level: 0
          retention-days: 30

      # ISO files exceed GitHub's 2 GB release limit → SourceForge.
      # Secrets: SF_SSH_KEY (private key), SF_USER, SF_PROJECT
      - name: Upload to SourceForge (tags only)
        if: startsWith(github.ref, 'refs/tags/v') && env.SF_USER != ''
        env:
          SF_SSH_KEY: ${{ secrets.SF_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SF_SSH_KEY" > ~/.ssh/sourceforge && chmod 600 ~/.ssh/sourceforge
          ssh-keyscan frs.sourceforge.net >> ~/.ssh/known_hosts
          version="${GITHUB_REF_NAME#v}"
          rsync -av --progress -e "ssh -i ~/.ssh/sourceforge" out/*.iso out/*.sha256 \
            "$SF_USER@frs.sourceforge.net:/home/frs/project/$SF_PROJECT/$version/"
          # README in the files area → SourceForge shows it on the "Files" page
          rsync -av -e "ssh -i ~/.ssh/sourceforge" README.md \
            "$SF_USER@frs.sourceforge.net:/home/frs/project/$SF_PROJECT/"
          echo "SF_URL=https://sourceforge.net/projects/$SF_PROJECT/files/$version/" >> "$GITHUB_ENV"
      - name: GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: out/*.sha256
          body: |
            ## Frametide OS ${{ github.ref_name }}

            **Download:** ${{ env.SF_URL || 'as an artifact of this workflow run (Actions → Build ISO)' }}

            The SHA256 checksum is attached to this release. Please verify after downloading:
            `sha256sum -c frametide-os-*.iso.sha256`

            ⚠️ Alpha – please test in a VM or on a spare machine first.
