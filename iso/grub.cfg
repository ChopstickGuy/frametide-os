set default=0
set timeout=3
set timeout_style=menu

loadfont unicode
insmod all_video
insmod gfxterm
set gfxmode=auto
terminal_output gfxterm
set color_normal=light-gray/black
set color_highlight=black/cyan
set menu_color_normal=light-gray/black
set menu_color_highlight=black/cyan

# Gemeinsame Live-Optionen: Deutsch, kein Datenträger-Check (schnellerer Start)
set live="boot=casper fsck.mode=skip locale=de_DE.UTF-8 keyboard-configuration/layoutcode=de quiet splash loglevel=3"

menuentry "@DISTRO_NAME@ starten / installieren" --class frametide {
    linux  /casper/vmlinuz $live ---
    initrd /casper/initrd
}
menuentry "Kompatibilitätsmodus (bei Grafikproblemen)" {
    linux  /casper/vmlinuz $live nomodeset ---
    initrd /casper/initrd
}
menuentry "English (US keyboard)" {
    linux  /casper/vmlinuz boot=casper fsck.mode=skip quiet splash loglevel=3 ---
    initrd /casper/initrd
}
if [ "$grub_platform" = "efi" ]; then
menuentry "UEFI-Firmware-Einstellungen" {
    fwsetup
}
fi
