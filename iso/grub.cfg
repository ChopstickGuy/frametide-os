set default=0
set timeout=8
set timeout_style=menu

loadfont unicode
insmod all_video
insmod gfxterm
set gfxmode=auto
terminal_output gfxterm
set color_normal=light-gray/black
set color_highlight=black/cyan
set menu_color_normal=light-gray/black
set menu_color_highlight=black/cyan

menuentry "@DISTRO_NAME@ @DISTRO_VERSION@ starten" --class vektor {
    linux  /casper/vmlinuz boot=casper quiet splash preempt=full ---
    initrd /casper/initrd
}
menuentry "@DISTRO_NAME@ – Kompatibilitätsmodus (Grafikprobleme)" {
    linux  /casper/vmlinuz boot=casper nomodeset quiet splash ---
    initrd /casper/initrd
}
menuentry "@DISTRO_NAME@ – Ohne Nouveau (neue NVIDIA-Karten mit Bildfehlern)" {
    linux  /casper/vmlinuz boot=casper modprobe.blacklist=nouveau nouveau.modeset=0 nomodeset quiet splash ---
    initrd /casper/initrd
}
menuentry "@DISTRO_NAME@ – Speichertest/Fehlersuche (ausführliche Meldungen)" {
    linux  /casper/vmlinuz boot=casper debug ---
    initrd /casper/initrd
}
if [ "$grub_platform" = "efi" ]; then
menuentry "UEFI-Firmware-Einstellungen" {
    fwsetup
}
fi
