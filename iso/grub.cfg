set default=0
set timeout=5
set timeout_style=menu

loadfont unicode
insmod all_video
insmod gfxterm
set gfxmode=auto
terminal_output gfxterm
set color_normal=light-gray/black
set color_highlight=black/cyan
set menu_color_normal=light-gray/black
set menu_color_highlight=black/cyan

# Common live options: no disk check (faster start). Default language: English, US keyboard.
# The language and keyboard can be changed again in the installer's first steps.
set live="boot=casper fsck.mode=skip quiet splash loglevel=3"

menuentry "Try or install @DISTRO_NAME@" --class frametide {
    linux  /casper/vmlinuz $live locale=en_US.UTF-8 keyboard-configuration/layoutcode=us ---
    initrd /casper/initrd
}
submenu "Other languages – Deutsch, Español, Italiano, Português …" {
    menuentry "Deutsch" {
        linux  /casper/vmlinuz $live locale=de_DE.UTF-8 keyboard-configuration/layoutcode=de ---
        initrd /casper/initrd
    }
    menuentry "Español" {
        linux  /casper/vmlinuz $live locale=es_ES.UTF-8 keyboard-configuration/layoutcode=es ---
        initrd /casper/initrd
    }
    menuentry "Italiano" {
        linux  /casper/vmlinuz $live locale=it_IT.UTF-8 keyboard-configuration/layoutcode=it ---
        initrd /casper/initrd
    }
    menuentry "Português (Portugal)" {
        linux  /casper/vmlinuz $live locale=pt_PT.UTF-8 keyboard-configuration/layoutcode=pt ---
        initrd /casper/initrd
    }
    menuentry "Português (Brasil)" {
        linux  /casper/vmlinuz $live locale=pt_BR.UTF-8 keyboard-configuration/layoutcode=br ---
        initrd /casper/initrd
    }
    menuentry "Français" {
        linux  /casper/vmlinuz $live locale=fr_FR.UTF-8 keyboard-configuration/layoutcode=fr ---
        initrd /casper/initrd
    }
    menuentry "Nederlands" {
        linux  /casper/vmlinuz $live locale=nl_NL.UTF-8 keyboard-configuration/layoutcode=us ---
        initrd /casper/initrd
    }
    menuentry "Polski" {
        linux  /casper/vmlinuz $live locale=pl_PL.UTF-8 keyboard-configuration/layoutcode=pl ---
        initrd /casper/initrd
    }
    menuentry "Türkçe" {
        linux  /casper/vmlinuz $live locale=tr_TR.UTF-8 keyboard-configuration/layoutcode=tr ---
        initrd /casper/initrd
    }
    menuentry "Русский" {
        linux  /casper/vmlinuz $live locale=ru_RU.UTF-8 keyboard-configuration/layoutcode=ru ---
        initrd /casper/initrd
    }
    menuentry "English (UK)" {
        linux  /casper/vmlinuz $live locale=en_GB.UTF-8 keyboard-configuration/layoutcode=gb ---
        initrd /casper/initrd
    }
}
menuentry "Safe graphics mode (if the screen stays black)" {
    linux  /casper/vmlinuz $live locale=en_US.UTF-8 keyboard-configuration/layoutcode=us nomodeset ---
    initrd /casper/initrd
}
if [ "$grub_platform" = "efi" ]; then
menuentry "UEFI firmware settings" {
    fwsetup
}
fi
