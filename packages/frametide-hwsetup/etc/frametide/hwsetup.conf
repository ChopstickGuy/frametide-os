# Frametide OS – Hardware-Einrichtung
# Experimentell: für x86-64-v3 optimierte Ubuntu-Pakete nutzen (nur wenn die CPU es kann).
AMD64V3=no
# Übertakten/Undervolting von AMD-GPUs in CoreCtrl/LACT freischalten
AMD_OVERDRIVE=no
# RGB auf manchen Mainboards/RAM-Riegeln (acpi_enforce_resources=lax)
SMBUS_LAX=no
