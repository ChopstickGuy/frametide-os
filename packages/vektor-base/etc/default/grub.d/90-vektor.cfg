# Vektor OS Kernel-Parameter (Hardware-spezifische landen in 91-vektor-hw.cfg)
GRUB_DISTRIBUTOR="Vektor OS"
GRUB_TIMEOUT_STYLE=hidden
GRUB_TIMEOUT=2
# preempt=full : niedrigere Latenz (Ubuntu-Kernel ist PREEMPT_DYNAMIC)
# zswap aus    : wir nutzen zram
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash preempt=full nowatchdog zswap.enabled=0"
