---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
  - id: grubpkg
    module: shellprocess
    config: shellprocess_grubpkg.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - packages
      - initramfs
      - shellprocess@grubpkg
      - grubcfg
      - bootloader
      - umount
  - show:
      - finished

branding: frametide
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
