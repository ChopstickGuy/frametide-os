---
# EFI-Systempartition (neuer und älterer Schlüssel – Ubuntus Calamares wertet beide aus)
efi:
  mountPoint: "/boot/efi"
  recommendedSize: 512MiB
  minimumSize: 300MiB
  label: "EFI"
efiSystemPartition: "/boot/efi"

# Kein Swap auf der Platte – Frametide nutzt zram im Arbeitsspeicher
userSwapChoices: [ none, file ]
initialSwapChoice: none

drawNestedPartitions: false
alwaysShowPartitionLabels: true
showNotEncryptedBootMessage: false

defaultFileSystemType: "ext4"
availableFileSystemTypes: [ "ext4", "btrfs", "xfs" ]

# Nichts vorauswählen: Wer neben Windows installiert, soll nicht versehentlich alles löschen
initialPartitioningChoice: none

# Verschlüsselung erst in einer späteren Version (braucht zusätzliche Installer-Schritte)
enableLuksAutomatedPartitioning: false

# Was „Festplatte löschen“ anlegt. OHNE diesen Abschnitt legt Ubuntus Calamares nur eine
# leere Partitionstabelle an (keine Systempartition) – daher der Fehler „rsync Code 11“.
# Die EFI-Partition ergänzt Calamares bei UEFI automatisch.
partitionLayout:
    - name: "frametide"
      filesystem: unknown        # = gewähltes Dateisystem (Standard ext4)
      mountPoint: "/"
      size: 100%
