---
# Installer-Protokoll ins neue System kopieren (für Fehlerberichte)
dontChroot: true
timeout: 30
script:
    - "-mkdir -p ${ROOT}/var/log/installer"
    - "-sh -c 'cp /root/.cache/calamares/session.log ${ROOT}/var/log/installer/calamares.log 2>/dev/null || cp $HOME/.cache/calamares/session.log ${ROOT}/var/log/installer/calamares.log'"
