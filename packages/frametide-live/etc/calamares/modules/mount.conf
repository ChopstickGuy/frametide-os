---
# Systemverzeichnisse im Zielsystem einhängen – ohne diese Datei schlagen spätere
# Schritte fehl (übernommen von Ubuntus Lubuntu-Konfiguration für 26.04).
extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: [ bind ]
    - device: tmpfs
      fs: tmpfs
      mountPoint: /run
    - device: /run/udev
      mountPoint: /run/udev
      options: [ bind ]
    - device: efivarfs
      fs: efivarfs
      mountPoint: /sys/firmware/efi/efivars
      efi: true
    - device: /run/systemd/resolve
      mountPoint: /run/systemd/resolve
      options: [ bind ]
    - device: /cdrom
      mountPoint: /cdrom
      options: [ bind ]

# noatime: keine Schreibzugriffe nur fürs Lesen (schnellere Ladezeiten, SSD-schonend)
mountOptions:
    - filesystem: default
      options: [ defaults, noatime ]
    - filesystem: efi
      options: [ defaults, umask=0077 ]
    - filesystem: btrfs
      options: [ defaults, noatime, compress=zstd:1 ]
      ssdOptions: [ discard=async ]
    - filesystem: ext4
      options: [ defaults, noatime ]
    - filesystem: xfs
      options: [ defaults, noatime ]
    - filesystem: swap
      options: [ sw ]
