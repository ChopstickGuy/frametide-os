---
defaultGroups:
  - adm
  - cdrom
  - dip
  - lpadmin
  - plugdev
  - sudo
  - name: gamemode
    must_exist: false
    system: true
  - name: video
    must_exist: true
  - name: render
    must_exist: true
autologinGroup: autologin
doAutologin: false
sudoersGroup: sudo
setRootPassword: false
passwordRequirements:
  minLength: 4
  maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: false
user:
  shell: /bin/bash
  forbidden_names: [ root ]
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "frametide-${cpu}"
  forbidden_names: [ localhost ]
