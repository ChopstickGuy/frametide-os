---
efiBootLoader: "grub"
kernelSearchPath: "/boot"
kernelName: "vmlinuz"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
# WICHTIG: Ubuntus signiertes GRUB sucht seine Konfiguration unter EFI/ubuntu.
# Mit einer anderen ID funktioniert Secure Boot (und damit NVIDIA ohne MOK) nicht.
efiBootloaderId: "ubuntu"
installEFIFallback: true
