---
# noatime: keine Schreibzugriffe nur fürs Lesen von Dateien (schnellere Spiele-Ladezeiten, SSD-schonend)
mountOptions:
  - filesystem: default
    options: [ defaults, noatime ]
  - filesystem: efi
    options: [ defaults, umask=0077 ]
  - filesystem: btrfs
    options: [ defaults, noatime, compress=zstd:1 ]
efiMountOptions: umask=0077
