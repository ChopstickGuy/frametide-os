; Frametide OS – GameMode-Profil. Aktivieren in Steam per Startoption:
;   gamemoderun %command%
[general]
renice=10
softrealtime=auto
inhibit_screensaver=1
desiredgov=performance
igpu_desiredgov=powersave
igpu_power_threshold=0.3

[gpu]
; Erlaubt GameMode, GPU-Leistungsstufen anzuheben (AMD: "high", NVIDIA: PowerMizer max)
apply_gpu_optimisations=accept-responsibility
gpu_device=0
amd_performance_level=high
nv_powermizer_mode=1

[cpu]
; X3D-CPUs: Spiele auf die Cache-CCD legen
pin_cores=yes
park_cores=no

[custom]
start=notify-send -i input-gaming "GameMode aktiv" "Maximale Leistung"
end=notify-send -i input-gaming "GameMode beendet"
