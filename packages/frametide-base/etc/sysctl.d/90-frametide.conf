# Frametide OS – Leistungs- und Latenz-Tuning

# Viele Spiele (v. a. über Proton/DXVK) brauchen sehr viele Speicher-Mappings
vm.max_map_count = 2147483642

# zram ist viel schneller als Page-Cache zu verwerfen -> aggressiv nutzen
vm.swappiness = 180
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.page-cluster = 0
vm.vfs_cache_pressure = 50

# Kleinere Schreibpuffer verhindern Ruckler bei großen Kopiervorgängen/Downloads
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864

# Keine künstliche Bremse bei Split-Locks (verursacht Frame-Drops in manchen Spielen)
kernel.split_lock_mitigate = 0
kernel.nmi_watchdog = 0

# Netzwerk: geringere Latenz online
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_fastopen = 3

# Entwickler: IDEs/File-Watcher
fs.inotify.max_user_watches = 524288
