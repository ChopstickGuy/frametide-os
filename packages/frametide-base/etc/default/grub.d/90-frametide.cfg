# Frametide OS – schneller, stiller Start (Hardware-Parameter: 91-frametide-hw.cfg)
GRUB_DISTRIBUTOR="Frametide OS"
# Kein sichtbares Bootmenü (Shift/Esc beim Start zeigt es trotzdem)
GRUB_TIMEOUT_STYLE=hidden
GRUB_TIMEOUT=0
# Nach einem fehlgeschlagenen Start nur 3 s Menü statt Ubuntus 30 s
GRUB_RECORDFAIL_TIMEOUT=3
# preempt=full : niedrigere Latenz (Ubuntu-Kernel ist PREEMPT_DYNAMIC)
# zswap aus    : wir nutzen zram
# loglevel=3   : keine Textmeldungen über dem Boot-Logo
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash loglevel=3 rd.udev.log_level=3 preempt=full nowatchdog zswap.enabled=0"
